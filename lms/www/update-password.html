<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set your eLearning password</title>
<link rel="icon" href="/assets/lms/frontend/elearning.svg">
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#141414;background:#ededed}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(at 15% 10%,#ffffff90,transparent 55%)}
main{width:min(360px,calc(100vw - 80px));padding:28px;border:1px solid #00000016;border-radius:24px;background:#ffffffa8;box-shadow:0 2px 2px #00000008}
h1{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:20px 0}p,label,input,select,button,a{font-size:14px;line-height:1.5}label{display:block;margin-top:16px}input,select{display:block;box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid #00000030;border-radius:12px;margin-top:6px;background:white}input[type=checkbox]{display:inline-block;width:auto;margin-right:8px}button{cursor:pointer;border:1px solid #00000020;border-radius:12px;padding:10px 16px;background:#2b59d1;color:white;width:100%;margin-top:20px}button:disabled{opacity:.6;cursor:wait}a{display:inline-block;margin-top:16px;color:#444}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2b59d1;outline-offset:3px}[role=alert]{color:#b91c1c}img{width:32px;height:32px}
</style>
</head>
<body><main>
<img src="/assets/lms/frontend/elearning.svg" alt="eLearning">
<h1>Set your password</h1>
{% if key or signed_in %}
<p>Use a long, unique password.</p>
<form id="reset-password">
{% if not key %}<label for="old_password">Current password</label><input id="old_password" type="password" autocomplete="current-password" required>{% endif %}
<label for="new_password">New password</label><input id="new_password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm_password">Confirm new password</label><input id="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
<button id="update" type="submit">Confirm</button>
</form>
{% else %}<p>Request a password reset to get a new link.</p>{% endif %}
<p id="message" role="alert" hidden></p>
<a href="/login">Back to sign in</a>
<script>
const form=document.getElementById('reset-password');
if(form) form.addEventListener('submit', async event => {
 event.preventDefault();const message=document.getElementById('message');message.hidden=true;
 const password=document.getElementById('new_password').value;
 if(password!==document.getElementById('confirm_password').value){message.textContent='The passwords do not match.';message.hidden=false;return;}
 const button=document.getElementById('update');button.disabled=true;
 try {
  const response=await fetch('/api/method/frappe.core.doctype.user.user.update_password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Frappe-CSRF-Token':{{ csrf_token | tojson }}},body:new URLSearchParams({new_password:password,key:{{ key | tojson }},old_password:document.getElementById('old_password')?.value||'',logout_all_sessions:'1'})});
  if(!response.ok){message.textContent=response.status===410?'This reset link is invalid or expired. Request a new link.':'Password could not be changed. Check your current password or choose a stronger new password.';message.hidden=false;return;}
  location.assign('/lms');
 }catch{message.textContent='Could not reach the site. Try again.';message.hidden=false;}
 finally{button.disabled=false;}
});
</script>
</main></body></html>
